[package]
name = "agentspec"
version = "0.1.0"
edition = "2024"
description = "Universal agent skill and sub-agent manager with TUI"
license = "Apache-2.0"
repository = "https://github.com/urmzd/agentspec"

[[bin]]
name = "agentspec"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ratatui = "0.29"
crossterm = "0.28"
color-eyre = "0.6"
thiserror = "2"
dirs = "6"
sha1 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
console = "0.15"
indicatif = "0.17"
atty = "0.2"
tempfile = "3"
pathdiff = "0.2"
skim = "0.10"
