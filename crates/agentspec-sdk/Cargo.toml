[package]
name = "agentspec-sdk"
version = "0.7.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for bootstrapping AI-powered CLI tools — self-update, terminal UI, config"
keywords = ["ai", "sdk", "cli", "agentspec"]
categories = ["development-tools"]

[features]
default = ["cli", "ui", "config", "update"]
cli = ["dep:agentspec-cli"]
ui = ["dep:agentspec-ui"]
config = ["dep:agentspec-config"]
update = ["dep:agentspec-update"]
full = ["default"]

[dependencies]
agentspec-cli = { workspace = true, optional = true }
agentspec-ui = { workspace = true, optional = true }
agentspec-config = { workspace = true, optional = true }
agentspec-update = { workspace = true, optional = true }
