name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  ci:
    if: github.actor != 'sr-releaser[bot]'
    uses: ./.github/workflows/ci.yml
  prepare:
    name: Prepare release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-release: ${{ steps.prepare.outputs.bump != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Bump the manifests on disk before building, so the binaries report the
      # version being released. Building the pushed commit as-is embeds the
      # previous version, because sr only bumps it in the release job.
      - name: Bump version files
        id: prepare
        uses: urmzd/sr@v9
        with:
          mode: prepare
      - name: Upload prepared manifests
        if: steps.prepare.outputs.bump != ''
        uses: actions/upload-artifact@v7
        with:
          name: prepared-manifests
          path: |
            Cargo.toml
            Cargo.lock
            **/Cargo.toml

  build:
    needs: prepare
    if: needs.prepare.outputs.should-release == 'true'
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            cross: false
          - target: aarch64-apple-darwin
            runner: macos-15
            cross: false
    steps:
      - uses: actions/checkout@v6
      - name: Apply prepared manifests
        uses: actions/download-artifact@v8
        with:
          name: prepared-manifests
          path: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentspec-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/agentspec
  release:
    environment: release
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.sr.outputs.released }}
      tag: ${{ steps.sr.outputs.tag }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liUsXGDICnIdo3Ev
          private-key: ${{ secrets.SR_RELEASER_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/agentspec-*/; do
            target=$(basename "$dir")
            cp "$dir/agentspec" "release-assets/$target"
            chmod +x "release-assets/$target"
          done
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Release
        id: sr
        uses: urmzd/sr@v9
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
