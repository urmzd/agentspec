[output]
dir = "./showcase"

[font]
family = "MonaspiceNe Nerd Font"

# NOTE: teasr currently ships only `dracula` (default) and `monokai` themes —
# unknown names silently fall back to dracula, so we set it explicitly.

# ── Static PNG: Skills tab with the link picker open ──
# Deliberately different from the GIF (which tours the tabs) so the two
# showcase assets are not redundant.
# NOTE: teasr's "enter" sends \n, which crossterm in raw mode reads as Ctrl+J,
# so Enter-driven flows (preview) can't be captured — `l` is a plain char.
[[scenes]]
type = "terminal"
name = "tui"
command = "agentspec"
theme = "dracula"
cols = 120
rows = 30
formats = [{ output_type = "png" }]
frame_duration = 120

# Wait for TUI to render
[[scenes.interactions]]
type = "wait"
duration = 2000
hidden = true

# Tools (default) -> Skills
[[scenes.interactions]]
type = "key"
key = "tab"

[[scenes.interactions]]
type = "wait"
duration = 500
hidden = true

# Open the link picker on the selected skill (`l` = link/expose to tools)
[[scenes.interactions]]
type = "key"
key = "l"

[[scenes.interactions]]
type = "wait"
duration = 500
hidden = true

[[scenes.interactions]]
type = "snapshot"
name = "link"

# ── Animated GIF: tour of all six tabs ──
# Tab cycle order (see Tab::next in crates/agentspec/src/tui/app.rs):
# Tools -> Skills -> Agents -> Configs -> Sessions -> Memories
[[scenes]]
type = "terminal"
name = "tui-demo"
command = "agentspec"
theme = "dracula"
cols = 120
rows = 30
formats = [{ output_type = "gif" }]
frame_duration = 120

# Wait for TUI to render
[[scenes.interactions]]
type = "wait"
duration = 2000
hidden = true

# Tab 1: Tools (default)
[[scenes.interactions]]
type = "snapshot"

[[scenes.interactions]]
type = "wait"
duration = 1500

# Tab 2: Skills
[[scenes.interactions]]
type = "key"
key = "tab"

[[scenes.interactions]]
type = "wait"
duration = 500

[[scenes.interactions]]
type = "snapshot"

[[scenes.interactions]]
type = "wait"
duration = 1500

# Tab 3: Agents
[[scenes.interactions]]
type = "key"
key = "tab"

[[scenes.interactions]]
type = "wait"
duration = 500

[[scenes.interactions]]
type = "snapshot"

[[scenes.interactions]]
type = "wait"
duration = 1500

# Tab 4: Configs
[[scenes.interactions]]
type = "key"
key = "tab"

[[scenes.interactions]]
type = "wait"
duration = 500

[[scenes.interactions]]
type = "snapshot"

[[scenes.interactions]]
type = "wait"
duration = 1500

# Tab 5: Sessions
[[scenes.interactions]]
type = "key"
key = "tab"

[[scenes.interactions]]
type = "wait"
duration = 500

[[scenes.interactions]]
type = "snapshot"

[[scenes.interactions]]
