[output]
dir = "./showcase"

[font]
family = "MonaspiceNe Nerd Font"

[[output.formats]]
output_type = "png"

# ── TUI showcase: just the Tools tab ──
[[scenes]]
type = "terminal"
name = "tui"
command = "agentspec"
theme = "dracula"
cols = 120
rows = 30
formats = [{ output_type = "png" }]
frame_duration = 120

# Wait for TUI to render
[[scenes.interactions]]
type = "wait"
duration = 2000
hidden = true

# Tools tab (default) — capture it
[[scenes.interactions]]
type = "snapshot"
name = "tools"
