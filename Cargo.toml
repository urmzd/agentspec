[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.9.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/urmzd/agentspec"
authors = ["urmzd"]
homepage = "https://github.com/urmzd/agentspec"

[workspace.dependencies]
# Internal SDK crate
agentspec-sdk = { path = "crates/agentspec-sdk", version = "0.9.3" }

# Error handling
thiserror = "2"
anyhow = "1"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_yaml_ng = "0.10"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Terminal UI
crossterm = "0.28"
indicatif = "0.17"
ratatui = "0.29"
console = "0.15"

# HTTP
ureq = { version = "3", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Hashing
sha1 = "0.10"
sha2 = "0.10"

# Directories
dirs = "6"

# Temporary files
tempfile = "3"

# Misc (agentspec binary deps)
color-eyre = "0.6"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
atty = "0.2"
pathdiff = "0.2"
skim = "0.10"
fuzzy-matcher = "0.3.7"
