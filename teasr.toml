[output]
dir = "./showcase"

[font]
family = "MonaspiceNe Nerd Font"

[[output.formats]]
output_type = "png"

# ── TUI showcase: just the Tools tab ──
[[scenes]]
type = "terminal"
name = "tui"
theme = "dracula"
cols = 120
rows = 30
formats = [{ output_type = "png" }]
frame_duration = 120

# Launch the TUI
[[scenes.interactions]]
type = "type"
text = "agentspec"
speed = 50
hidden = true

[[scenes.interactions]]
type = "key"
key = "enter"
hidden = true

[[scenes.interactions]]
type = "wait"
duration = 2000
hidden = true

# Tools tab (default) — capture it
[[scenes.interactions]]
type = "snapshot"
name = "tools"

# Quit the TUI, then EOF to exit the shell so teardown doesn't hang
[[scenes.interactions]]
type = "key"
key = "q"
hidden = true

[[scenes.interactions]]
type = "key"
key = "ctrl-d"
hidden = true
