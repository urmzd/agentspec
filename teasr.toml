[output]
dir = "./showcase"

[font]
family = "MonaspiceNe Nerd Font"

# Both scenes run ./showcase/demo.sh, which seeds a sanitized demo HOME in
# /tmp/agentspec-demo (fake skills, agents, MCP servers, sessions, memories,
# projects) and launches the TUI against it. Captures must never run against
# a real HOME: real sessions, memories, and project lists leak personal data.
#
# NOTE: teasr currently ships only `dracula` (default) and `monokai` themes —
# unknown names silently fall back to dracula, so we set it explicitly.
# NOTE: teasr's "enter" sends \n, which crossterm in raw mode reads as Ctrl+J,
# so Enter-driven flows (preview, form submit) can't be captured — stick to
# plain-char keys (`l`, `a`) and Tab.

# ── Static PNG: MCP tab with the add-server form filled in ──
# Deliberately different from the GIF (which tours the tabs) so the two
# showcase assets are not redundant.
[[scenes]]
type = "terminal"
name = "tui"
command = "./showcase/demo.sh"
theme = "dracula"
cols = 120
rows = 30
formats = [{ output_type = "png" }]
frame_duration = 120

# Wait for seeding + TUI render
[[scenes.interactions]]
type = "wait"
duration = 4000
hidden = true

# Tools (default) -> Skills -> Agents -> MCP
[[scenes.interactions]]
type = "key"
key = "tab"

[[scenes.interactions]]
type = "key"
key = "tab"

[[scenes.interactions]]
type = "key"
key = "tab"

[[scenes.interactions]]
type = "wait"
duration = 500
hidden = true

# Open the add-server form and fill in a stdio server
[[scenes.interactions]]
type = "key"
key = "a"

[[scenes.interactions]]
type = "type"
text = "linear"

[[scenes.interactions]]
type = "key"
key = "tab"

[[scenes.interactions]]
type = "type"
text = "linear-mcp"

[[scenes.interactions]]
type = "key"
key = "tab"

[[scenes.interactions]]
type = "type"
text = "serve --team platform"

[[scenes.interactions]]
type = "wait"
duration = 500
hidden = true

[[scenes.interactions]]
type = "snapshot"
name = "mcp-add"

# ── Animated GIF: tour of all eight tabs ──
# Tab cycle order (see Tab::next in crates/agentspec/src/tui/app.rs):
# Tools -> Skills -> Agents -> MCP -> Configs -> Sessions -> Fleets -> Memories
[[scenes]]
type = "terminal"
name = "tui-demo"
command = "./showcase/demo.sh"
theme = "dracula"
cols = 120
rows = 30
formats = [{ output_type = "gif" }]
frame_duration = 120

# Wait for seeding + TUI render
[[scenes.interactions]]
type = "wait"
duration = 4000
hidden = true

# Tab 1: Tools (default)
[[scenes.interactions]]
