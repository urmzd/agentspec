[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.14.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/urmzd/agentspec"
authors = ["urmzd"]
homepage = "https://github.com/urmzd/agentspec"

[workspace.dependencies]
# Internal SDK crate
agentspec-sdk = { path = "crates/agentspec-sdk", version = "0.14.1" }

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.8"
toml_edit = "0.22"

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Terminal UI
crossterm = "0.28"
ratatui = "0.29"
console = "0.15"

# HTTP
ureq = { version = "3", features = ["json"] }

# Hashing
sha2 = "0.10"

# Directories
dirs = "6"

# Temporary files
tempfile = "3"

# CLI integration tests
assert_cmd = "2"

# Conformance suite (golden snapshots + property tests)
insta = { version = "1", features = ["yaml"] }
proptest = "1"

# Misc (agentspec binary deps)
color-eyre = "0.6"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
pathdiff = "0.2"
skim = "0.10"
fuzzy-matcher = "0.3.7"
regex = "1"

# Embedded SQLite (Copilot session-store.db reader)
rusqlite = { version = "0.32", features = ["bundled"] }
